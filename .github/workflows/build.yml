name: Build OpenWrt packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/**'
      - 'Makefile'
      - 'tailscale/**'
      - 'htdocs/**'
      - 'root/**'
      - 'po/**'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/**'
      - 'Makefile'
      - 'tailscale/**'
      - 'htdocs/**'
      - 'root/**'
      - 'po/**'

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: OpenWrt ${{ matrix.release }} / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        release: ['24.10.8', '25.12.6']
        target: ['x86/64', 'mediatek/filogic']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd

      - name: Build daemon, LuCI and translations
        env:
          OPENWRT_RELEASE: ${{ matrix.release }}
          OPENWRT_TARGET: ${{ matrix.target }}
          BUILD_ROOT: ${{ runner.temp }}/openwrt-build
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: bash .github/scripts/build-openwrt.sh

      - name: Name artifact
        id: artifact
        env:
          TARGET: ${{ matrix.target }}
          RELEASE: ${{ matrix.release }}
        run: echo "name=openwrt-${RELEASE}-${TARGET//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload packages and build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/openwrt-build/sdk/logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all package bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: openwrt-*
          path: release-assets

      - name: Archive each release and target separately
        run: |
          mkdir bundles
          for directory in release-assets/openwrt-*; do
            tar -czf "bundles/$(basename "$directory").tar.gz" -C "$directory" .
          done
          cd bundles
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Create release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" bundles/* --clobber
